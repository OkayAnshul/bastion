name: bastion

# Application services share one image; each sets its own command.
x-bastion-app: &bastion-app
  build: .
  image: bastion:dev
  env_file:
    - path: .env
      required: false
  environment:
    BASTION_REDIS_URL: redis://redis:6379/0
    BASTION_KAFKA_BOOTSTRAP: redpanda:9092
    BASTION_MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./docs/results:/app/docs/results

services:
  # Kafka-API-compatible broker (ADR-001). Two listeners: `redpanda:9092` for containers,
  # `localhost:19092` for code running on the host.
  redpanda:
    image: redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Online feature store. `noeviction` makes a full store fail writes loudly: silently
  # evicting feature state would skew features without any error.
  redis:
    image: redis:8.6.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Experiment tracking + model registry. Clients upload artifacts over HTTP
  # (--serve-artifacts), so no shared volume is needed between containers.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=localhost,localhost:5000,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # One-off CLI runs inside the stack, e.g. `docker compose run --rm app info`.
  app:
    <<: *bastion-app
    profiles: ["tools"]
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  # Consumes transactions and labels and keeps the Redis online store current (Phase 2).
  feature-builder:
    <<: *bastion-app
    command: ["stream", "features"]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- demo profile: `docker compose --profile demo up`, then open http://localhost:3000 ----

  # Prepares synthetic events, a trained model and a tuned policy once (ARCHITECTURE §5). Later runs
  # find them in data/ and artifacts/ and exit immediately.
  bootstrap:
    <<: *bastion-app
    profiles: ["demo"]
    command: ["demo", "bootstrap"]
    depends_on:
      mlflow:
        condition: service_healthy

  # POST /v1/score with the demo model and its tuned review threshold. Decisions go to Redpanda.
  scoring:
    <<: *bastion-app
    profiles: ["demo"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BASTION_REDIS_URL: redis://redis:6379/0
      BASTION_KAFKA_BOOTSTRAP: redpanda:9092
      BASTION_MLFLOW_TRACKING_URI: http://mlflow:5000
      BASTION_DECISION_SINK: kafka
      BASTION_MODEL_PATH: artifacts/demo/model
      BASTION_POLICY_PATH: artifacts/demo/policy.json
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # The payment gateway: replays the synthetic table in event time (one hour per second), asking the
  # scoring service for a decision before publishing each transaction.
  simulator:
    <<: *bastion-app
    profiles: ["demo"]
    command: ["stream", "replay", "--events", "data/processed/events_synthetic.parquet",
              "--speedup", "3600", "--score-url", "http://scoring:8000"]
    depends_on:
      feature-builder:
        condition: service_started
      scoring:
        condition: service_healthy

  # Decisions topic into the console's SQLite store (artifacts/decisions/decisions.db).
  decision-sink:
    <<: *bastion-app
    profiles: ["demo"]
    command: ["stream", "decisions"]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy

  # Analyst console: live decisions, review queue, case pages.
  console:
    <<: *bastion-app
    profiles: ["demo"]
    command: ["console", "--address", "0.0.0.0", "--port", "3000"]
    environment:
      BASTION_SCORING_URL: http://scoring:8000
    ports:
      - "3000:3000"
    depends_on:
      decision-sink:
        condition: service_started

volumes:
  redpanda-data:
  mlflow-data:
