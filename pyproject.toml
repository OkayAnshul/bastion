[project]
name = "bastion"
version = "0.1.0"
description = "Real-time payments fraud and risk decisioning platform, built on public (IEEE-CIS) and simulated data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "OkayAnshul" }]
dependencies = [
    "lightgbm>=4.5",
    "matplotlib>=3.10",
    "mlflow>=3.1",
    "numpy>=2.2",
    "polars>=1.30",
    "pyarrow>=19",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6",
    "structlog>=25.1",
    "typer>=0.15",
]

[project.optional-dependencies]
# Only needed to fetch IEEE-CIS; the runtime images never download data.
data = ["kaggle>=1.7"]

[project.scripts]
bastion = "bastion.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT", "NPY", "C4", "PTH", "T20"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["bastion"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "kaggle.*", "pyarrow.*", "lightgbm.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration and not data"]
markers = [
    "integration: needs Redis/Redpanda started with `make up`",
    "data: needs the IEEE-CIS dataset prepared with `make data`",
]
